# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "https://github.com/optional-dev/no-ai-coauthors"
rev = "c5b3dd7d242c96d6a337f8355e80ebfd3284bb76" # 1.0.0
hooks = [
  { id = "no-ai-coauthors" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "swift-format",
    name = "run swift-format format",
    entry = "swift format format -i --configuration .swift-format.json",
    language = "system",
    files = '.*\.swift$',
    exclude = '^Vendor/(swift-hash|swift-png)/',
    pass_filenames = true
  },
  {
    id = "no-foundation-in-library-products",
    name = "forbid Foundation imports in library layers",
    entry = "./Scripts/check_foundation_imports.sh",
    language = "system",
    files = '^(Sources/(SwiftTUICore|SwiftTUIViews|SwiftTUI)|Vendor/swift-figlet/Sources/(EmbeddedFonts|SwiftFiglet))/.*\.swift$',
    pass_filenames = false
  },
  {
    id = "public-surface-policies",
    name = "enforce public surface and documentation guardrails",
    entry = "./Scripts/check_public_surface_policies.sh",
    language = "system",
    files = '^(Package\.swift|README\.md|AGENTS\.md|docs/(ARCHITECTURE|PUBLIC-API)\.md|Sources/.*\.swift|Platforms/.*\.swift|Sources/SwiftTUIViews/SwiftTUIViews\.docc/Authoring-Views\.md|Sources/SwiftTUIRuntime/SwiftTUIRuntime\.docc/Running-Apps\.md|Tests/SwiftTUIViewsTests/(ActorIsolationSurfaceTests|CollectionSupportTests|ViewCompositionSurfaceTests)\.swift|Tests/SwiftTUICoreTests/Phase0FoundationTests\.swift|Tests/SwiftTUITests/(AppRuntimeTests|DiagnosticsAndCacheTests|InteractiveRuntimeTests|LayoutAndRenderingPipelineTests|Phase1BenchmarkScenariosTests|Phase5ReliabilityGatesTests|Support/InteractiveDemoTestSupport)\.swift)$',
    pass_filenames = false
  },
  {
    id = "structured-concurrency-escape-hatches",
    name = "forbid unchecked concurrency and @safe escape hatches",
    entry = "./Scripts/check_concurrency_safety_policies.sh",
    language = "system",
    files = '^(Package\.swift|(Sources|Tests|Platforms)/.*\.swift)$',
    pass_filenames = false
  },
  {
    id = "main-thread-usage",
    name = "forbid bare Thread.isMainThread without thread-ismain-ok justification",
    entry = "./Scripts/check_main_thread_usage.sh",
    language = "system",
    files = '^((Sources|Tests|Platforms)/.*\.swift|Scripts/check_main_thread_usage\.sh)$',
    pass_filenames = false
  },
]
