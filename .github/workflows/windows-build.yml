name: Windows Build

# Windows build + test lane (swift-tui-org Windows plan, Stage 6 item 2).
#
# Builds every target plus the test bundles on both Windows architectures
# via the swift.org installer route: arm64 matches the development VM's
# aarch64-unknown-windows-msvc exactly (and the Swift Windows Docker images
# are amd64-only, so arm64 has no container route); x64 covers the
# ecosystem's dominant runner class. SwiftPM dependency checkouts need the
# symlink privilege; hosted GitHub runners have it (the dev-VM provisioning
# note from the plan).
#
# Test execution mirrors the item-3 runtime survey's proven shape:
# gate-shaped serial lanes (`--no-parallel --filter <target>`), because a
# plain parallel `swift test` dies early on Windows, and the runner linked
# with `/STACK:16777216` — the default 1 MiB runner stack kills the
# deep-descent suites (the item-9 class, test-harness edition). The lane
# list is the survey's final green set; POSIX-only test targets
# (PTY/attach/WebHost/UnixSignals/EntryPointLaunch families) compile empty
# on Windows and are omitted rather than run vacuously.
#
# Deliberately NOT wired into the org-root gates: the operator keeps
# Windows on the child repo's native `swift build` while per-repo version
# drift lands.
#
# Runs on pull requests, nightly, on every release tag, and on demand.
# Only the nightly run skips itself when `main` has not moved since its
# last green run.

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Skip if unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      key: ${{ steps.probe.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe the lane verdict cache
        id: probe
        uses: ./.github/actions/lane-verdict-probe
        with:
          lane: windows-build

  build:
    name: Windows build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    # Green runs peak at 42.6 minutes; the former 120-minute cap only ever
    # bounded hangs.
    timeout-minutes: 60
    env:
      # Same policy as the POSIX repo gate: the gate builds with
      # warnings-as-errors so new Windows-only warnings fail here instead of
      # accreting (Windows plan, Stage 6 item 11; the manifest reads this at
      # evaluation time, so it must cover every swift invocation in the job).
      SWIFTTUI_WARNINGS_AS_ERRORS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
          - arch: amd64
            runner: windows-2022
    steps:
      - name: Install Swift
        uses: compnerd/gha-setup-swift@v0.4.0
        with:
          source: swift.org
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
          build_arch: ${{ matrix.arch }}

      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: windows-${{ matrix.arch }}-swift-6.3.3-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            windows-${{ matrix.arch }}-swift-6.3.3-

      - name: Drop cached dependency checkouts
        shell: pwsh
        run: |
          # actions/cache does not faithfully round-trip the symlinks inside
          # SwiftPM dependency checkouts on Windows: swift-docc-plugin shares
          # its plugin sources through a "Symbolic Links" directory, and a
          # restored checkout compiles those plugins without the shared
          # sources ("cannot find type 'SnippetExtractor' in scope" — every
          # cache-restoring run failed while the cold first run was green).
          # Re-clone checkouts fresh each run; the bare mirrors under
          # .build/repositories stay cached, so the re-checkout is cheap.
          if (Test-Path .build\checkouts) {
            Remove-Item -Recurse -Force .build\checkouts
          }

      - name: Build all targets
        run: swift build

      - name: Build test bundles
        run: swift build --build-tests -Xlinker /STACK:16777216

      - name: Run test lanes
        shell: pwsh
        run: |
          $lanes = @(
            'SwiftTUICoreTests', 'SwiftTUIGraphTests', 'SwiftTUIViewsTests',
            'SwiftTUITests', 'SwiftTUIArgumentsTests', 'SwiftTUICLITests',
            'SwiftTUIWASISurfaceBridgeTests', 'SwiftTUIWASITests',
            'SwiftTUIAnimatedImageTests', 'SwiftTUIProfilingTests',
            'SwiftTUIVendorFigletTests', 'SwiftTUIVendorGIFTests',
            'SwiftTUIVendorJPEGTests', 'SwiftTUIVendorPNGTests'
          )
          $failed = @()
          foreach ($lane in $lanes) {
            Write-Host "=== lane $lane ==="
            swift test --no-parallel --filter $lane -Xlinker /STACK:16777216
            if ($LASTEXITCODE -ne 0) { $failed += $lane }
          }
          if ($failed.Count -gt 0) {
            Write-Error ("failing lanes: " + ($failed -join ', '))
            exit 1
          }

  record:
    name: Record green verdict
    runs-on: ubuntu-24.04
    needs:
      - changes
      - build
    if: needs.changes.outputs.changed == 'true' && needs.build.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record the lane verdict
        uses: ./.github/actions/lane-verdict-record
        with:
          key: ${{ needs.changes.outputs.key }}
