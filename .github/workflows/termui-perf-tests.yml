name: TermUIPerf Tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/termui-perf-tests.yml"
      - ".swift-version"
      - "Package.resolved"
      - "Package.swift"
      - "Sources/**"
      - "Platforms/**"
      - "Tests/**"
      - "Scripts/**"
      - "Tools/TermUIPerf/**"
  pull_request:
    paths:
      - ".github/workflows/termui-perf-tests.yml"
      - ".swift-version"
      - "Package.resolved"
      - "Package.swift"
      - "Sources/**"
      - "Platforms/**"
      - "Tests/**"
      - "Scripts/**"
      - "Tools/TermUIPerf/**"
  workflow_dispatch:
    inputs:
      qualify_app_shell:
        description: Run seven app-shell probes and the full suite on three fresh amd64 jobs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: termui-perf-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLY_VERSION: "1.1.4"

jobs:
  termui-perf-tests:
    name: TermUIPerf package tests (${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.qualify_app_shell && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(inputs.qualify_app_shell && '[1,2,3]' || '[1]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux test dependencies
        shell: bash
        run: |
          set -euo pipefail
          Scripts/apt_get_retry.sh update
          Scripts/apt_get_retry.sh install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            libcurl4-openssl-dev \
            unzip

      - name: Cache Swiftly toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/swiftly
            ~/.local/bin/swiftly
          key: ${{ runner.os }}-swiftly-${{ env.SWIFTLY_VERSION }}-${{ hashFiles('.swift-version') }}
          restore-keys: |
            ${{ runner.os }}-swiftly-${{ env.SWIFTLY_VERSION }}-

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          export SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          export SWIFTLY_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$SWIFTLY_BIN_DIR"
          export PATH="$SWIFTLY_BIN_DIR:$PATH"

          if ! command -v swiftly >/dev/null 2>&1 || [ ! -f "${SWIFTLY_HOME_DIR}/env.sh" ]; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            cd "$tmpdir"
            swiftly_archive="swiftly-${SWIFTLY_VERSION}-$(uname -m).tar.gz"
            curl -fsSLO "https://download.swift.org/swiftly/linux/${swiftly_archive}"
            tar -zxf "$swiftly_archive"
            ./swiftly init --skip-install --quiet-shell-followup --assume-yes
          fi

          . "${SWIFTLY_HOME_DIR}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.swift-version")"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-termui-perf-tests-${{ hashFiles('Tools/TermUIPerf/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-termui-perf-tests-
            ${{ runner.os }}-swiftpm-

      - name: Run TermUIPerf package tests
        shell: bash
        env:
          DISABLE_EXPLICIT_PLATFORMS: "1"
        run: |
          set -euo pipefail
          # Cold renders and live scenarios share the main actor. Keep unrelated
          # tests out of each scenario's watchdog window (STUI-1080); sync/async
          # rendering and all workload assertions remain exercised within tests.
          swiftly run swift test --no-parallel --package-path Tools/TermUIPerf

      - name: Qualify the former app-shell quarantine
        if: inputs.qualify_app_shell
        shell: bash
        env:
          DISABLE_EXPLICIT_PLATFORMS: "1"
        run: |
          set -euo pipefail
          for sample in 1 2 3 4 5 6 7; do
            echo "App-shell qualification $sample of 7"
            swiftly run swift test --skip-build --no-parallel --package-path Tools/TermUIPerf --filter appShellCompletesEveryInteraction
          done
