name: Release Soundness Lane

# F05: the only release-configuration test executions in the repo.
# The serialized runtime soak includes historically load-sensitive suites.
# Every assertion, crash and invocation failure contributes to the verdict.
#
# Runs on pull requests, nightly, on every release tag, and on demand.
# Only the nightly run skips itself when `main` has
# not moved since its last green run (§6 guard), which also answers the
# reason the earlier cron was removed: a red can only settle onto a commit
# this lane has not yet passed, never re-fail one it already cleared.
#
# Shape (since 2026-08-31): the Repo Gate's shape, in release. One job per
# part — `core` (SwiftTUICoreTests, the isolated SwiftTUITests launches, then
# the runtime soak step) and one serialized SwiftTUITests shard each for
# the rows of Scripts/data/runtime-shards.txt — plus the actor data-race
# variant, every one in the swift-tui-linux image with gdb and SYS_PTRACE so
# the per-launch silence watchdog can dump a wedge instead of burning the
# cap. `release-build` builds release ONCE per run and publishes the
# exact-revision bundle; every part restores it and runs its launches with
# --skip-build. `record` merges the parts' soundness traces, scans them once
# against the exact-count ledger, and only then records the verdict. Before
# 2026-08-31 the lane ran all of SwiftTUITests in ONE parallel `swift test` —
# ~1,600 tests in flight on a four-vCPU runner — and had not been green since
# 2026-08-04 (flake register entry 20 records the two failure shapes).
#
# Build once (since 2026-11-15), as the Repo Gate has since STUI-1412. Until
# then each part compiled the identical release bundle for itself, so the one
# build had four chances per run to fail and four runners were spent on one
# result (flake register entry 26). The race variant's flag changes the build
# signature, so that job alone still builds for itself.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_race_checks:
        description: Also run the -enable-actor-data-race-checks variant
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "*.*.*"
  schedule:
    - cron: "5 4 * * *"

permissions:
  contents: read

concurrency:
  group: release-soundness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Full stress churn-loop iteration counts (plan 2026-08-25-001 Stage 2b):
  # the push gate runs the hot-path counts; this lane restores the full ones.
  SWIFTTUI_STRESS_FULL: "1"
  # Release, with the probe on every frame and the full stress counts, is
  # still the heaviest configuration in the org even serialized. Run-loop
  # animation tests get less real time here than on an interactive machine,
  # so bounds written for one expire while the animation is still mid-flight
  # — on 2026-08-26 that showed up as six `ContentTransition` roll pins
  # reading a mid-roll frame and four animator waits timing out, all of
  # which pass in release locally. The deadlines are what get stretched;
  # every expectation still has to hold.
  SWIFTTUI_TEST_TIMEOUT_SCALE: "4"
  # Per-launch silence watchdog (Scripts/lib/step_watchdog.sh), sized with
  # the 50-minute cap the part jobs carry: worst-case kill of a silent launch
  # = 600 idle + 300 busy grace + 10 kill grace = 910 s, and the
  # livelock-while-printing backstop at 2400 s fits too. The parts restore
  # their bundle, so both bounds can fire inside the cap. While each part
  # built for itself the build took 55 to 69 of its 75 minutes, and neither
  # bound could. The release build runs outside the watchdog (a whole-module
  # compile prints nothing while it is busy); its job's cap bounds it.
  SWIFTTUI_TEST_STEP_TIMEOUT_SECONDS: "600"
  SWIFTTUI_TEST_STEP_BUSY_GRACE_SECONDS: "300"
  SWIFTTUI_TEST_STEP_ABSOLUTE_TIMEOUT_SECONDS: "2400"
  SWIFTTUI_TEST_STEP_WATCHDOG_DEADLINE_SECONDS: "3000"
  SWIFTTUI_HANG_DIAGNOSTICS: "1"

jobs:
  changes:
    name: Skip if unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      key: ${{ steps.probe.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe the lane verdict cache
        id: probe
        uses: ./.github/actions/lane-verdict-probe
        with:
          lane: release-soundness

  # The one release build of the run. The wrapper keeps a memory record of
  # it, retained below whether the build passes or fails: a compiler process
  # the kernel kills for memory leaves no diagnostic of its own (STUI-1539).
  release-build:
    name: Build release tests
    runs-on: ubuntu-24.04
    container:
      # Tracks .swift-version — bump together (Scripts/prepare_ci_container.sh
      # fails loud on drift).
      image: ghcr.io/swifttui/swift-tui-linux:swift-6.4.3
      options: --cap-add=SYS_PTRACE
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    # The job took 33.8 and 34.1 minutes on the hosted runner (runs
    # 43945363284 and 44015903471): 32.5 minutes of build, half a minute of
    # packaging. The whole-module build it replaces took 55 to 69 minutes in
    # every part (runs 43153599569 and 43364371621).
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare container environment
        shell: bash
        run: Scripts/prepare_ci_container.sh

      # Same key as the Repo Gate's lanes: dependency checkouts do not depend
      # on the build configuration, so this reuses the gate's cache.
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-amd64-swiftpm-lane-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-amd64-swiftpm-lane-

      - name: Build release test bundle once
        shell: bash
        run: Scripts/build_ci_release_test_bundle.sh

      - name: Retain release build record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-record
          path: .build/ci-release-build
          if-no-files-found: warn
          retention-days: 14

      - name: Package exact-revision release test bundle
        run: python3 Scripts/ci_test_bundle.py pack --kind release

      - name: Upload release test bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-tests-linux-amd64
          path: ci-test-bundle.tar.gz
          compression-level: 0
          retention-days: 1

  release-soundness:
    name: Release soundness (${{ matrix.part }})
    runs-on: ubuntu-24.04
    container:
      # The build job's image: the bundle's receipt names the toolchain and
      # the workspace path, and verification refuses any other.
      image: ghcr.io/swifttui/swift-tui-linux:swift-6.4.3
      # The step watchdog's hang diagnostics attach gdb to a process that is
      # not its descendant; yama ptrace_scope=1 refuses that without the
      # capability, and the default container capability set omits it.
      options: --cap-add=SYS_PTRACE
    needs:
      - changes
      - release-build
    if: needs.changes.outputs.changed == 'true'
    # A part took 3.2 to 6.6 minutes on the hosted runner (runs 43945363284
    # and 44015903471). The cap is the 2400 s backstop plus restore and setup;
    # SWIFTTUI_TEST_STEP_WATCHDOG_DEADLINE_SECONDS above is this cap in
    # seconds.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # `core` plus the shard ids of Scripts/data/runtime-shards.txt, in
        # the manifest's order. Adding a shard row means adding it here.
        part: [core, A, B, C]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare container environment
        shell: bash
        run: Scripts/prepare_ci_container.sh

      - name: Download release test bundle
        uses: actions/download-artifact@v8
        with:
          name: release-tests-linux-amd64

      - name: Restore release test bundle
        run: tar -xzf ci-test-bundle.tar.gz && rm ci-test-bundle.tar.gz

      # Present in images built after 2026-08-25; installed here until then.
      # Root in the container has no sudo.
      - name: Ensure gdb for hang diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gdb >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              export APT_GET_RETRY_SUDO_BIN=""
            fi
            Scripts/apt_get_retry.sh update
            Scripts/apt_get_retry.sh install -y --no-install-recommends gdb
          fi

      - name: Release soundness lane
        shell: bash
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          sh ./Scripts/release_soundness_lane.sh --prebuilt --part "$PART"

      # The same restored bundle: the soak verifies it again and every launch
      # is `--skip-build`.
      - name: Release runtime soak
        if: matrix.part == 'core'
        shell: bash
        run: bash Scripts/run_release_soak.sh sh ./Scripts/release_soundness_lane.sh --prebuilt --flaky-only

      - name: Upload release soak diagnostics
        if: always() && matrix.part == 'core'
        uses: actions/upload-artifact@v7
        with:
          name: release-soak
          path: |
            .build/release-soak
            .build/release-soundness-logs/flaky-only
            .build/soundness-trace/release-flaky-only
          if-no-files-found: warn
          retention-days: 14

      # Each soak launch is scanned by its own script. The part artifacts
      # feed the existing merged scan without counting the soak twice.
      - name: Upload soundness traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soundness-trace-release-${{ matrix.part }}
          path: .build/soundness-trace/release-part-${{ matrix.part }}
          if-no-files-found: error
          retention-days: 1

  # `inputs` is empty on schedule and tag runs; the variant runs unless a
  # dispatch explicitly opts out. Its own job: the flag changes the build
  # signature, so it is a second full release build either way, and in its
  # own job that build runs beside the parts instead of after them.
  race-checks:
    name: Actor data-race checks variant
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/swifttui/swift-tui-linux:swift-6.4.3
      options: --cap-add=SYS_PTRACE
    needs: changes
    if: needs.changes.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_race_checks)
    # The flag changes the build signature, so this job compiles every target
    # a second time, outside the watchdog. The job took 23.5 and 33.5 minutes
    # on the hosted runner (runs 44015903471 and 43945363284), almost all of
    # it build. The cap leaves the 2400 s backstop room to fire after a build
    # of that length; with the whole-module SwiftTUITests compile the build
    # alone took 83 of the 90 minutes (run 43364371621).
    timeout-minutes: 90
    env:
      SWIFTTUI_TEST_STEP_WATCHDOG_DEADLINE_SECONDS: "5400"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare container environment
        shell: bash
        run: Scripts/prepare_ci_container.sh

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-amd64-swiftpm-lane-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-amd64-swiftpm-lane-

      - name: Ensure gdb for hang diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gdb >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              export APT_GET_RETRY_SUDO_BIN=""
            fi
            Scripts/apt_get_retry.sh update
            Scripts/apt_get_retry.sh install -y --no-install-recommends gdb
          fi

      - name: Actor data-race checks variant
        shell: bash
        run: |
          set -euo pipefail
          sh ./Scripts/release_soundness_lane.sh --race-checks

  # A verdict needs every part AND the race variant green: a dispatch that
  # opted out of the variant leaves `race-checks` skipped, so this job is
  # skipped too and nothing is recorded — the nightly then still owes this
  # SHA a full run. The merged scan runs here, before the record, for the
  # same reason the Repo Gate's aggregator scans: the ledger's counts are
  # whole-surface, and a per-part scan could only ever see a fraction.
  record:
    name: Record green verdict
    runs-on: ubuntu-24.04
    needs:
      - changes
      - release-soundness
      - race-checks
    if: needs.changes.outputs.changed == 'true' && needs.release-soundness.result == 'success' && needs.race-checks.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Each part's traces land in their own subdirectory (no merge-multiple:
      # invocation indices collide across parts).
      - name: Download soundness traces
        uses: actions/download-artifact@v8
        with:
          path: .build/soundness-trace-merged
          pattern: soundness-trace-release-*

      - name: Scan merged soundness traces
        shell: bash
        run: |
          set -euo pipefail
          parts="$(find .build/soundness-trace-merged -mindepth 1 -maxdepth 1 -type d -name 'soundness-trace-release-*' | sort)"
          count="$(printf '%s\n' "$parts" | sed '/^$/d' | wc -l | tr -d ' ')"
          printf 'merged trace parts (%s):\n%s\n' "$count" "$parts"
          if [ "$count" -ne 4 ]; then
            echo "::error::expected traces from exactly 4 parts (core, A, B, C); found $count — a part's upload is missing, so the ledger counts would be understated"
            exit 1
          fi
          Scripts/scan_soundness_traces.sh .build/soundness-trace-merged Scripts/soundness_quarantine.txt

      - name: Record the lane verdict
        uses: ./.github/actions/lane-verdict-record
        with:
          key: ${{ needs.changes.outputs.key }}
