name: Release Soundness Lane

# F05: the only release-configuration test executions in the repo. Never a
# push/PR gate: release builds are slow, and the lane's flaky-suite step
# intentionally exercises the load-flaky run-loop suites
# (swift-tui-org/docs/swift-tui/KNOWN-TEST-FLAKES.md #1) where an intermittent
# red is signal, not a merge blocker.
#
# Runs nightly, on every release tag, and on demand (swift-tui-org plan
# 2026-08-25-001 Stages 1e/5). The nightly run skips itself when `main` has
# not moved since its last green run (§6 guard), which also answers the
# reason the earlier cron was removed: a red can only settle onto a commit
# this lane has not yet passed, never re-fail one it already cleared.

on:
  workflow_dispatch:
    inputs:
      run_race_checks:
        description: Also run the -enable-actor-data-race-checks variant
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "*.*.*"
  schedule:
    - cron: "5 4 * * *"

permissions:
  contents: read

concurrency:
  group: release-soundness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLY_VERSION: "1.1.3"
  # Full stress churn-loop iteration counts (plan 2026-08-25-001 Stage 2b):
  # the push gate runs the hot-path counts; this lane restores the full ones.
  SWIFTTUI_STRESS_FULL: "1"
  # This is the most contended lane in the org: the whole suite in parallel, in
  # release, with the full stress counts. Run-loop animation tests get a
  # fraction of real time here, so bounds written for an interactive machine
  # expire while the animation is still mid-flight — on 2026-08-26 that showed
  # up as six `ContentTransition` roll pins reading a mid-roll frame and four
  # animator waits timing out, all of which pass in release locally. The
  # deadlines are what get stretched; every expectation still has to hold.
  SWIFTTUI_TEST_TIMEOUT_SCALE: "4"

jobs:
  changes:
    name: Skip if unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      key: ${{ steps.probe.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe the lane verdict cache
        id: probe
        uses: ./.github/actions/lane-verdict-probe
        with:
          lane: release-soundness

  release-soundness:
    name: Release soundness lane
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux test dependencies
        shell: bash
        run: |
          set -euo pipefail
          Scripts/apt_get_retry.sh update
          Scripts/apt_get_retry.sh install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            libcurl4-openssl-dev \
            python3 \
            unzip

      - name: Cache Swiftly toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/swiftly
            ~/.local/bin/swiftly
          key: ${{ runner.os }}-amd64-swiftly-${{ env.SWIFTLY_VERSION }}-${{ hashFiles('.swift-version') }}
          restore-keys: |
            ${{ runner.os }}-amd64-swiftly-${{ env.SWIFTLY_VERSION }}-

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          export SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          export SWIFTLY_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$SWIFTLY_BIN_DIR"
          export PATH="$SWIFTLY_BIN_DIR:$PATH"

          if ! command -v swiftly >/dev/null 2>&1 || [ ! -f "${SWIFTLY_HOME_DIR}/env.sh" ]; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            cd "$tmpdir"
            swiftly_archive="swiftly-${SWIFTLY_VERSION}-$(uname -m).tar.gz"
            curl -fsSLO "https://download.swift.org/swiftly/linux/${swiftly_archive}"
            tar -zxf "$swiftly_archive"
            ./swiftly init --skip-install --quiet-shell-followup --assume-yes
          fi

          . "${SWIFTLY_HOME_DIR}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.swift-version")"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-amd64-swiftpm-release-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-amd64-swiftpm-release-

      - name: Release soundness lane
        shell: bash
        run: |
          set -euo pipefail
          sh ./Scripts/release_soundness_lane.sh

      - name: Load-flaky suites (signal only, never blocks)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # continue-on-error masked a 100%-broken lane for days (an arg error
          # killed the script 130 ms in while the run stayed green) — annotate
          # loudly so a red here is visible in the run summary either way.
          if ! sh ./Scripts/release_soundness_lane.sh --flaky-only; then
            echo "::warning title=Release soundness flaky lane::flaky-trio run failed — crash signal (swift-tui-org/docs/swift-tui/KNOWN-TEST-FLAKES.md #1) or lane breakage; inspect this step's log"
            exit 1
          fi

      # `inputs` is empty on schedule and tag runs; the variant runs unless a
      # dispatch explicitly opts out.
      - name: Actor data-race checks variant
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_race_checks }}
        shell: bash
        run: |
          set -euo pipefail
          sh ./Scripts/release_soundness_lane.sh --race-checks

  record:
    name: Record green verdict
    runs-on: ubuntu-24.04
    needs:
      - changes
      - release-soundness
    if: needs.changes.outputs.changed == 'true' && needs.release-soundness.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record the lane verdict
        uses: ./.github/actions/lane-verdict-record
        with:
          key: ${{ needs.changes.outputs.key }}
