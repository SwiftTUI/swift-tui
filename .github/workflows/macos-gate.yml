name: macOS Gate

# The macOS repo gate runs on pull requests, pushes to main, release tags,
# nightly, and on demand. Only the nightly run skips itself when `main` has
# not moved since its last green run. Run it before a release:
# `gh workflow run macos-gate.yml`.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: macos-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  changes:
    name: Skip if unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      key: ${{ steps.probe.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe the lane verdict cache
        id: probe
        uses: ./.github/actions/lane-verdict-probe
        with:
          lane: macos-gate

  native-build:
    name: Build macOS tests
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    timeout-minutes: 45
    env:
      SWIFTTUI_WARNINGS_AS_ERRORS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pinned Swift toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains
          key: macos-26-swiftly-${{ runner.arch }}-${{ hashFiles('.swift-version') }}

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.swiftly/bin/swiftly" ] || [ ! -f "$HOME/.swiftly/env.sh" ]; then
            curl --fail --retry 3 -O https://download.swift.org/swiftly/darwin/swiftly.pkg
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
            ~/.swiftly/bin/swiftly init --skip-install --quiet-shell-followup --assume-yes
          fi
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < .swift-version)"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"

      - name: Install macOS test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-gate-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-gate-
            ${{ runner.os }}-swiftpm-

      - name: Cache Bun deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-gate-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-gate-
            ${{ runner.os }}-bun-

      - name: Install Bun workspace deps
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build native test bundle once
        timeout-minutes: 30
        run: Scripts/build_ci_test_bundle.sh
      - name: Retain native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-diagnostics-macos
          path: .build/ci-build.*
          retention-days: 3
      - name: Package exact-revision test bundle
        run: python3 Scripts/ci_test_bundle.py pack
      - name: Upload native test bundle
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-macos
          path: ci-test-bundle.tar.gz
          compression-level: 0
          retention-days: 1

  native-tests:
    name: macOS ${{ matrix.lane }}
    runs-on: macos-26
    needs: native-build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: [core, 'runtime:A', 'runtime:B', 'runtime:C']
    env:
      SWIFTTUI_TEST_STEP_TIMEOUT_SECONDS: "600"
      SWIFTTUI_TEST_STEP_BUSY_GRACE_SECONDS: "300"
      SWIFTTUI_TEST_STEP_ABSOLUTE_TIMEOUT_SECONDS: "1800"
      SWIFTTUI_TEST_STEP_WATCHDOG_DEADLINE_SECONDS: "2400"
      SWIFTTUI_SKIP_PUBLIC_API_BASELINE: "1"
      SWIFTTUI_SKIP_TERMUIPERF: "1"
      SWIFTTUI_STRESS_FULL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pinned Swift toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains
          key: macos-26-swiftly-${{ runner.arch }}-${{ hashFiles('.swift-version') }}

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.swiftly/bin/swiftly" ] || [ ! -f "$HOME/.swiftly/env.sh" ]; then
            curl --fail --retry 3 -O https://download.swift.org/swiftly/darwin/swiftly.pkg
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
            ~/.swiftly/bin/swiftly init --skip-install --quiet-shell-followup --assume-yes
          fi
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < .swift-version)"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"

      - name: Install macOS test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-gate-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-gate-
            ${{ runner.os }}-swiftpm-

      - name: Cache Bun deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-gate-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-gate-
            ${{ runner.os }}-bun-

      - name: Install Bun workspace deps
        shell: bash
        run: bun install --frozen-lockfile

      - name: Download native test bundle
        uses: actions/download-artifact@v8
        with:
          name: native-tests-macos
      - name: Restore native test bundle
        run: tar -xzf ci-test-bundle.tar.gz && rm ci-test-bundle.tar.gz
      - name: Run policy lane
        if: matrix.lane == 'core'
        run: sh Scripts/test_gate.sh --lane policy --skip-bun-install
      - name: Run native lane
        env:
          LANE: ${{ matrix.lane }}
        run: sh Scripts/test_gate.sh --prebuilt --lane "$LANE" --skip-bun-install
      - name: Source structure observations
        if: always() && matrix.lane == 'core'
        run: |
          python3 Scripts/source_inventory.py --compare docs/source-structure.json --output .build/source-observations/census.json
          cat .build/source-observations/census.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source observations
        if: always() && matrix.lane == 'core'
        uses: actions/upload-artifact@v7
        with:
          name: source-observations-macos
          path: .build/source-observations
      - name: Name trace artifact
        if: always()
        env:
          LANE: ${{ matrix.lane }}
        run: echo "TRACE_LANE=${LANE//:/-}" >> "$GITHUB_ENV"
      - name: Upload soundness traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soundness-macos-${{ env.TRACE_LANE }}
          path: .build/soundness-trace
          if-no-files-found: error
          retention-days: 1

  macos-gate:
    name: macOS repo gate
    runs-on: ubuntu-24.04
    needs: [changes, native-build, native-tests]
    if: always() && needs.changes.outputs.changed == 'true' && !contains(needs.*.result, 'cancelled')
    timeout-minutes: 10
    steps:
      - name: Require every native lane green
        env:
          BUILD_RESULT: ${{ needs.native-build.result }}
          TEST_RESULT: ${{ needs.native-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download soundness traces
        uses: actions/download-artifact@v8
        with:
          path: .build/soundness-trace-merged
          pattern: soundness-macos-*
      - name: Scan merged soundness traces
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .build/soundness-trace-merged -mindepth 1 -maxdepth 1 -type d -name 'soundness-macos-*' | wc -l)
          test "$count" -eq 4
          Scripts/scan_soundness_traces.sh .build/soundness-trace-merged Scripts/soundness_quarantine.txt

  public-semantics:
    name: macOS public semantic fixtures
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    # The adapter uses an uninstrumented build, so it cannot reuse the repo
    # gate's module-trace build. Running it after the ~61-minute gate exhausted
    # that job's 75-minute cap (39304126780). Give the comparison its own budget:
    # 120s oracle compiler, 30s oracle, 1800s cold SwiftTUI build and 900s
    # SwiftTUI execution, plus toolchain setup and artifact upload.
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pinned Swift toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains
          key: macos-26-swiftly-${{ runner.arch }}-${{ hashFiles('.swift-version') }}

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.swiftly/bin/swiftly" ] || [ ! -f "$HOME/.swiftly/env.sh" ]; then
            curl --fail --retry 3 -O https://download.swift.org/swiftly/darwin/swiftly.pkg
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
            ~/.swiftly/bin/swiftly init --skip-install --quiet-shell-followup --assume-yes
          fi
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < .swift-version)"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-gate-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-gate-
            ${{ runner.os }}-swiftpm-

      - name: Public semantic differential fixtures
        shell: bash
        run: python3 Scripts/run_public_semantics.py

      - name: Upload public semantic observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-semantics-macos
          path: .build/public-semantics

  record:
    name: Record green verdict
    runs-on: ubuntu-24.04
    needs:
      - changes
      - macos-gate
      - public-semantics
    if: needs.changes.outputs.changed == 'true' && needs.macos-gate.result == 'success' && needs.public-semantics.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record the lane verdict
        uses: ./.github/actions/lane-verdict-record
        with:
          key: ${{ needs.changes.outputs.key }}
