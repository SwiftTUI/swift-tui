version: 1
builder:
  configs:
    - documentation_targets:
        # Keep SwiftTUI first as the primary hosted documentation entry point.
        # Keep this list aligned with Scripts/lib/public_docc_targets.txt,
        # which also records the intentionally unpublished targets.
        - SwiftTUI
        - SwiftTUIViews
        - SwiftTUIRuntime
        - SwiftTUIArguments
        - SwiftTUITerminalCLI
        - SwiftTUICLI
        - SwiftTUITerminalEmulation
        - SwiftTUITerminal
        - SwiftTUIWASI
        - SwiftTUIWebHost
        - SwiftTUIWebHostCLI
        - SwiftTUIAndroidHost
        - SwiftTUIAnimatedImage
        - SwiftTUIProfiling
