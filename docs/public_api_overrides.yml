    # `Spinner.SpinnerSet` vocabulary and the declaration-scoped spinner
    # initializer. Nested declarations are not top-level names, so their
    # removal is carried by the flat baseline diff rather than this list.
    # Retired by the control-style A1 List/Table split (plan 2026-08-12-002):
    # ASCII outline selection moved to rasterizer fallback, and the combined
    # collection presentation split into ListStylePresentation and
    # TableStylePresentation.
    - SwiftTUIViews.ASCIIOutlineStyle
    - SwiftTUIPrimitives.CollectionStylePresentation
    # Retired by the control-style A4 presentation-chrome break: sheet
