# Public API classification overrides.
#
# Maps each live top-level public symbol's "Module.Name" to a classification.
#
# Shipped-product symbols are classified explicitly. Module defaults are
# restricted to package-only and test-support modules whose entire charter has
# one classification. Every other unlisted symbol falls into `pending-review`
# and makes the inventory's --check mode fail.
#
# Add a symbol by placing its qualified dump name in the appropriate bucket.
# Retire a symbol by moving its last qualified declaration name to `removed:`;
# a removed name reappearing in a dump is a hard failure. Platform-conditional
# live symbols may also be named under `platform_exceptions:`, but still need
# an ordinary classification or note and are validated wherever they appear.
#
# Classifications:
#   canonical          — part of the supported authoring/runtime story.
#                        Documented in DocC and PUBLIC-API.md.
#   package-only-seam  — exists for transitional reasons; not part of the
#                        intended product surface but tolerated.
#   test-support       — exposed only to support test access; not for
#                        ordinary app code.
#   deprecated         — public but slated for removal; carries a deprecation
#                        annotation in source.
#   removed            — explicitly retired. If a build emits a symbol with a
#                        name in this list the --check run fails.
#
# Global default for unclassified symbols: pending-review.

