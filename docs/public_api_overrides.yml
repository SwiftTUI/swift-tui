    # public enum case. Its members are package — authors use Shape.path(in:).
    - SwiftTUIPrimitives.BoxedPath

  removed:
    # Compatibility-shim types that were retired. If any of these reappears
    # in the source, the --check run fails.
    - SwiftTUI.FrameDiagnosticsLogger
    # Renamed to ScrollCellOffset in the pre-launch SwiftUI-divergence sweep
    # so SwiftUI's ScrollPosition name is no longer claimed by raw-offset
    # semantics.
    - SwiftTUIViews.ScrollPosition
    - SwiftTUIRuntime.FileOpenError
    - SwiftTUIRuntime.Standard
    - SwiftTUIViews.ErrorToastStyle
    # Retired before the 0.9 preview cut: the generic custom-transition body
    # could express arbitrary modifiers while the runtime silently extracted
    # only opacity and offset. Built-in AnyTransition effects remain canonical.
    - SwiftTUIViews.Transition
    - SwiftTUIViews.TransitionContent
    - SwiftTUIViews.TransitionPhase
