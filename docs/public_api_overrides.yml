# Module defaults are limited to modules whose entire charter has one
# classification. Shipped products classify every top-level symbol explicitly
# so a new API cannot silently inherit `canonical`.
module_defaults:
  SwiftTUIPrimitives: package-only-seam
  SwiftTUIGraph: package-only-seam
  SwiftTUICore: package-only-seam
  SwiftTUIPTYCPrimitives: package-only-seam
  SwiftTUITestSupport: test-support

# Global fallback for any symbol not otherwise classified.
default: pending-review

# Symbols which are known to be compiled out on some dump platforms. Entries
# remain subject to ordinary key validation on every platform where they are
# present. Keep this list exact; never use it for renamed or retired symbols.
platform_exceptions: []

# Optional human-readable notes appended in the generated baseline next to a
# live qualified name. Keep these short — PUBLIC-API.md owns longer rationale.
notes: {}

# Symbols that carry a SwiftUI name with deliberately different semantics.
# Orthogonal to the classification axis above. `--check` fails unless each
# listed symbol is live AND named in the divergence register
# (Sources/SwiftTUIViews/SwiftTUIViews.docc/Divergences-And-Gaps.md), so a
# divergent surface cannot ship unrecorded and the register cannot silently
# rot. Add a symbol here whenever a SwiftUI-named API's behavior or signature
# departs from SwiftUI's; write the register entry in the same change.
swiftui_divergent:
  - SwiftTUIViews.Binding
  - SwiftTUIViews.Canvas
  - SwiftTUIViews.DragGesture
  - SwiftTUIViews.ForEach
  - SwiftTUIViews.Image
  - SwiftTUIViews.List
  - SwiftTUIViews.LongPressGesture
  - SwiftTUIViews.Picker
  - SwiftTUIViews.ScrollView
  - SwiftTUIViews.ScrollViewProxy
  - SwiftTUIViews.ScrollViewReader
  - SwiftTUIViews.Slider
  - SwiftTUIViews.Spacer
  - SwiftTUIViews.SpatialTapGesture
  - SwiftTUIViews.State
  - SwiftTUIViews.TabView
  - SwiftTUIViews.Table
  - SwiftTUIViews.Text
  - SwiftTUIViews.TextField
  - SwiftTUIViews.Transaction
  - SwiftTUIViews.TransactionKey
  - SwiftTUIRuntime.WindowGroup
