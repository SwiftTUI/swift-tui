<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebHost</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #webhost-root,
      .webhost-scene-root {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .webhost-scene-root {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .webhost-scene {
        box-sizing: border-box;
        width: 80%;
        height: 80%;
        max-width: 100%;
        max-height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        resize: both;
      }

      .webhost-scene__header {
        display: none;
      }

      .webhost-scene__terminal {
        box-sizing: border-box;
        width: 100%;
        height: auto;
        min-width: 0;
        min-height: 0;
        align-self: stretch;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      .webhost-scene__terminal canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: default;
      }
    </style>
    
  <script type="module" crossorigin src="./index-wvwx900f.js"></script></head>
  <body>
    <main id="webhost-root"></main>
  </body>
</html>
